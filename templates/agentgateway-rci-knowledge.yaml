# yaml-language-server: $schema=https://agentgateway.dev/schema/config
#
# Example: the generic prefix-authz rules (templates/agentgateway-prefix-authz.yaml)
# pointed at one hosted MCP server, with optional OIDC. This file is not the product.
# Copy it, change `host`, issuer, and JWKS. Needs agentgateway >= 1.0.1.
#
#   authentication  jwtAuth when a token is sent (mode: optional; anonymous still served)
#   authorization   lookup_* / list_* open; calculate_* needs the `operator` role
#
# The client sends its own X-API-Key; the gateway forwards it (no key in this file).

mcp:
  port: 3100
  policies:
    jwtAuth:
      mode: optional
      issuer: http://127.0.0.1:19180/realms/cel
      jwks:
        url: http://127.0.0.1:19180/realms/cel/protocol/openid-connect/certs
    mcpAuthorization:
      rules:
        # policies/authorization/allow_lookup_tools.cel
        - 'mcp.tool.name.startsWith("lookup_") || mcp.tool.name.startsWith("list_")'
        # policies/authorization/require_operator_for_calculate.cel
        - 'mcp.tool.name.startsWith("calculate_") && has(jwt.sub) && has(jwt.roles) && jwt.roles.exists(r, r == "operator")'
  targets:
    - name: rci
      mcp:
        host: https://api.rcintell.com/v1/mcp
